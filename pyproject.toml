[project]
name = "ha-weheat-insights"
version = "0.6.7"
description = "Unofficial Home Assistant integration with insights for Weheat heat pumps"
requires-python = ">=3.14"
license = "MIT"

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "D", "PL", "ASYNC"]
ignore = ["D203", "D213", "PLR0913", "PLR2004"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "PLR2004", "PLR0915"]

[tool.ruff.lint.isort]
known-first-party = ["custom_components.weheat_insights"]
force-sort-within-sections = true
combine-as-imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
